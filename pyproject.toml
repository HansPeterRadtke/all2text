[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "all2text"
version = "0.1.0"
description = "Convert heterogeneous folder trees into auditable plain-text outputs."
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [
  {name = "Hans Peter Radtke"}
]
keywords = ["text extraction", "file conversion", "rag", "metadata", "archives"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing",
  "Topic :: System :: Archiving",
]
dependencies = []

[project.optional-dependencies]
documents = [
  "beautifulsoup4>=4.12",
  "openpyxl>=3.1",
  "pypdf>=4",
  "python-docx>=1.1",
  "python-pptx>=0.6.23",
]
ocr = [
  "Pillow>=10",
  "pytesseract>=0.3",
]
markitdown = [
  "markitdown>=0.1",
]
textract = [
  "textract>=1.6",
]
scientific = [
  "h5py>=3.10",
  "netCDF4>=1.6",
  "pyarrow>=15",
]
cad = [
  "ezdxf>=1.3",
]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]
all = [
  "beautifulsoup4>=4.12",
  "openpyxl>=3.1",
  "pypdf>=4",
  "python-docx>=1.1",
  "python-pptx>=0.6.23",
  "Pillow>=10",
  "pytesseract>=0.3",
  "markitdown>=0.1",
  "textract>=1.6",
  "h5py>=3.10",
  "netCDF4>=1.6",
  "pyarrow>=15",
  "ezdxf>=1.3",
]

[project.urls]
Homepage = "https://github.com/HansPeterRadtke/all2text"
Repository = "https://github.com/HansPeterRadtke/all2text"
Issues = "https://github.com/HansPeterRadtke/all2text/issues"

[project.scripts]
all2text = "all2text.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
