[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "all2text"
version = "0.1.0"
description = "Convert heterogeneous folder trees into auditable plain-text outputs."
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [
  {name = "Hans Peter Radtke"}
]
keywords = ["text extraction", "file conversion", "rag", "metadata", "archives"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing",
  "Topic :: System :: Archiving",
]
dependencies = [
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
documents = [
  "beautifulsoup4>=4.12",
  "ebooklib>=0.18",
  "odfpy>=1.4",
  "openpyxl>=3.1",
  "pypdf>=4",
  "python-docx>=1.1",
  "python-pptx>=0.6.23",
  "xlrd>=2.0",
]
images = [
  "Pillow>=10",
  "piexif>=1.1",
]
ocr = [
  "Pillow>=10",
  "pytesseract>=0.3",
]
media = [
  "mutagen>=1.47",
]
archives = [
  "py7zr>=0.21",
  "rarfile>=4.2",
]
markitdown = [
  "markitdown>=0.1",
]
legacy-textract = [
  "textract>=1.6,<2; python_version < '3.11'",
]
textract = [
  "textract>=1.6,<2; python_version < '3.11'",
]
scientific = [
  "astropy>=6",
  "h5py>=3.10",
  "netCDF4>=1.6",
  "numpy>=1.24",
  "pyarrow>=15",
  "scipy>=1.10",
]
cad = [
  "ezdxf>=1.3",
]
geospatial = [
  "pyproj>=3.5",
  "pyshp>=2.3",
  "shapely>=2",
]
fonts = [
  "fonttools>=4.50",
]
executables = [
  "macholib>=1.16; sys_platform == 'darwin'",
  "pefile>=2023.2.7",
]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]
all-pip = [
  "beautifulsoup4>=4.12",
  "ebooklib>=0.18",
  "odfpy>=1.4",
  "openpyxl>=3.1",
  "pypdf>=4",
  "python-docx>=1.1",
  "python-pptx>=0.6.23",
  "xlrd>=2.0",
  "Pillow>=10",
  "piexif>=1.1",
  "pytesseract>=0.3",
  "mutagen>=1.47",
  "py7zr>=0.21",
  "rarfile>=4.2",
  "markitdown>=0.1",
  "astropy>=6",
  "h5py>=3.10",
  "netCDF4>=1.6",
  "numpy>=1.24",
  "pyarrow>=15",
  "scipy>=1.10",
  "ezdxf>=1.3",
  "pyproj>=3.5",
  "pyshp>=2.3",
  "shapely>=2",
  "fonttools>=4.50",
  "macholib>=1.16; sys_platform == 'darwin'",
  "pefile>=2023.2.7",
]
all = [
  "beautifulsoup4>=4.12",
  "ebooklib>=0.18",
  "odfpy>=1.4",
  "openpyxl>=3.1",
  "pypdf>=4",
  "python-docx>=1.1",
  "python-pptx>=0.6.23",
  "xlrd>=2.0",
  "Pillow>=10",
  "piexif>=1.1",
  "pytesseract>=0.3",
  "mutagen>=1.47",
  "py7zr>=0.21",
  "rarfile>=4.2",
  "markitdown>=0.1",
  "astropy>=6",
  "h5py>=3.10",
  "netCDF4>=1.6",
  "numpy>=1.24",
  "pyarrow>=15",
  "scipy>=1.10",
  "ezdxf>=1.3",
  "pyproj>=3.5",
  "pyshp>=2.3",
  "shapely>=2",
  "fonttools>=4.50",
  "macholib>=1.16; sys_platform == 'darwin'",
  "pefile>=2023.2.7",
]

[project.urls]
Homepage = "https://github.com/HansPeterRadtke/all2text"
Repository = "https://github.com/HansPeterRadtke/all2text"
Issues = "https://github.com/HansPeterRadtke/all2text/issues"

[project.scripts]
all2text = "all2text.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
