[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "all2text"
version = "0.1.0"
description = "Convert heterogeneous folder trees into auditable plain-text outputs."
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [
  {name = "Hans Peter Radtke"}
]
keywords = ["text extraction", "file conversion", "rag", "metadata", "archives"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing",
  "Topic :: System :: Archiving",
]
dependencies = [
  "tomli>=2; python_version < '3.11'",
  "beautifulsoup4>=4.12",
  "ebooklib>=0.18",
  "lxml>=4.9,<6; python_version < '3.9'",
  "odfpy>=1.4",
  "openpyxl>=3.1",
  "pypdf>=4",
  "python-docx>=1.1",
  "python-pptx>=0.6.23",
  "xlrd>=2.0",
  "Pillow>=10",
  "piexif>=1.1",
  "pytesseract>=0.3",
  "mutagen>=1.47",
  "rarfile>=4.2",
  "markitdown>=0.1; python_version >= '3.10'",
  "astropy>=5.2,<6; python_version < '3.9'",
  "astropy>=6; python_version >= '3.9'",
  "h5py>=3.10; python_version >= '3.9'",
  "netCDF4>=1.6",
  "numpy>=1.24",
  "pyarrow>=15",
  "scipy>=1.10",
  "ezdxf>=1.1,<1.2; python_version < '3.9'",
  "ezdxf>=1.3; python_version >= '3.9'",
  "pyproj>=3.5",
  "pyshp>=2.3",
  "shapely>=2",
  "fonttools>=4.50",
  "macholib>=1.16; sys_platform == 'darwin'",
  "pefile>=2023.2.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]
legacy-textract = [
  "textract>=1.6,<2; python_version < '3.11'",
]
heavy-archives = [
  "py7zr>=0.21; python_version >= '3.9'",
]

[project.urls]
Homepage = "https://github.com/HansPeterRadtke/all2text"
Repository = "https://github.com/HansPeterRadtke/all2text"
Issues = "https://github.com/HansPeterRadtke/all2text/issues"

[project.scripts]
all2text = "all2text.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
