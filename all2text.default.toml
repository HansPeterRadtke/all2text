# Default all2text configuration template.
#
# Copy this file outside generated output directories and pass it with:
#   all2text --config /path/to/all2text.toml /path/to/source /path/to/output

[run]
profile = "auto"
max_header_bytes = 4096
max_hash_bytes = 268435456
max_binary_sample_bytes = 1048576
max_archive_members = 5000
use_file_command = true
auto_detect_python = true
auto_detect_tools = true
auto_detect_local_models = true
allow_optional_python = true
allow_external_tools = true
allow_local_models = true
copy_source_stat = true
reject_target_inside_source = true

[modules]
text = "text_exact_backend"
structured_text = "text_exact_backend"
source_code = "text_exact_backend"
notebook = "text_exact_backend"
email = "email_metadata_backend"
archive = "archive_listing_backend"
compressed = "archive_listing_backend"
database = "database_metadata_backend"
presentation = "document_native_backend"
image = "image_analysis_backend"
scientific_data = "scientific_placeholder_backend"
geospatial = "text_exact_backend"
cad_or_technical = "text_exact_backend"
font = "font_placeholder_backend"
executable_or_binary = "executable_placeholder_backend"
disk_image_or_container = "container_placeholder_backend"
unknown = "binary_fallback"

[modules.document]
backend = "document_native_backend"
max_pdf_pages = 100
max_text_blocks = 5000

[modules.spreadsheet]
backend = "document_native_backend"
include_hidden_sheets = true
max_cells_per_sheet = 20000

[modules.audio]
backend = "media_analysis_backend"
max_ffprobe_json_chars = 20000

[modules.video]
backend = "media_analysis_backend"
max_ffprobe_json_chars = 20000

[providers.ocr]
name = "tesseract"
enabled = true
language = "eng"
timeout_seconds = 30
preprocess = "none"
min_characters = 4
min_alnum_ratio = 0.35
min_confidence = 35
auto_invoke = true

[providers.image_classifier]
name = "none"
enabled = false
model_path = ""
labels = "default"
timeout_seconds = 120
auto_invoke = false

[providers.vlm]
name = "openai_compatible"
enabled = true
base_url = "http://127.0.0.1:14830/v1"
model = "Qwen2.5-VL-3B-Instruct-Q4_K_M.gguf"
timeout_seconds = 120
discovery_timeout_seconds = 0.5
max_tokens = 300
temperature = 0
prompt = "Describe visible evidence only."
auto_detect = true
auto_invoke = false

[providers.llm_text]
name = "openai_compatible"
enabled = true
base_url = "http://127.0.0.1:14829/v1"
model = "Qwen2.5-14B-Instruct-Q4_K_M.gguf"
timeout_seconds = 120
discovery_timeout_seconds = 0.5
max_tokens = 512
temperature = 0
prompt = "Summarize extracted text using only supplied evidence."
auto_detect = true
auto_invoke = false

[providers.chart]
name = "none"
enabled = false
specialist = "none"
model_path = ""
embedded_images_enabled = false
confidence_threshold = 0.6
timeout_seconds = 120
auto_invoke = false

[providers.document_intelligence]
name = "none"
enabled = false
endpoint = ""
api_key_env = ""
timeout_seconds = 120
auto_invoke = false

[providers.audio_classifier]
name = "none"
enabled = false
model_path = ""
labels = "speech,music,noise,mixed,unknown"
timeout_seconds = 120
auto_invoke = false

[providers.speech]
name = "none"
enabled = false
transcribe = false
translate = false
language_detection = false
model_path = ""
device = "auto"
timeout_seconds = 300
auto_invoke = false

[providers.diarization]
name = "none"
enabled = false
model_path = ""
device = "auto"
timeout_seconds = 300
auto_invoke = false

[providers.video_frames]
name = "none"
enabled = false
sample_frames = false
max_frames = 5
interval_seconds = 10
output_format = "png"
timeout_seconds = 120
auto_invoke = false
ocr = false
vlm = false

[providers.cad]
name = "none"
enabled = false
timeout_seconds = 120
auto_invoke = false

[providers.scientific]
name = "none"
enabled = false
timeout_seconds = 120
auto_invoke = false

[providers.geospatial]
name = "none"
enabled = false
timeout_seconds = 120
auto_invoke = false

[providers.binary_metadata]
name = "none"
enabled = false
timeout_seconds = 120
max_strings = 100
auto_invoke = false

[tools.file]
executable = "file"
path = ""
timeout_seconds = 5

[tools.getfacl]
executable = "getfacl"
path = ""
timeout_seconds = 5

[tools.ffprobe]
